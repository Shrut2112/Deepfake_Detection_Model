name: Deepfake Detection CI/CD

on:
  push:
    branch: [ "main" ]
  pull_request:
    branch: [ "main" ]

jobs: #can have multiple jobs which runs on seperate machine
  test: #this is the seperate job uses seperate VM
    runs-on: ubuntu-latest #VM os is specified here

    steps: #steps to follow for particular job
    - name: Checkout repository 
      uses: actions/checkout@v4

    - name: Set up python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx python-multipart
    
    - name: Run tests
      run: |
        python -m pytest -vv
  
  docker-build:
    needs: test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      run: |
        echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
        -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
    
    - name: Build and Push Docker Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/deepfake-detection:latest .
        docker push ${{ secrets.DOCKER_USERNAME }}/deepfake-detection:latest